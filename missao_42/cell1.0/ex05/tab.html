<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tela dividida</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        .tela {
            width: 100%;
            height: 100vh;
            display: flex;
        }

        .lado-esquerdo {
            width: 50%;
            height: 100%;
            background-color: blue;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 40px;
            font-family: Arial;
        }

        .lado-direito {
            width: 50%;
            height: 100%;
            background-color: red;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 40px;
            font-family: Arial;
        }
    </style>
</head>

<body>

    <div class="tela">

        <div class="lado-esquerdo">
            LADO VERMELHO (sim, esta do lado certo)
        </div>

        <div class="lado-direito">
            LADO AZUL (sim, esta mesmo do lado certo)
        </div>

    </div>

</body>
</html>
