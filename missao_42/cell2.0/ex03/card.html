<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Perfil</title>
    
</head>
<body>

    <div class="profile-card">
        <!-- Título no Topo -->
        <div class="card-title">User profile-card</div>

        <!-- Tabela Invisível para Alinhamento -->
        <table class="invisible-table">
            <tr>
                <td>
                    <!-- Foto de Perfil (Substitua a URL pela sua foto) -->
                    <img src="eu.png" alt="Foto de Perfil" class="profile-img">
                </td>
            </tr>
            <tr>
                <td>
                    <!-- Login abaixo da foto -->
                    <div class="user-login">@jfelizar</div>
                </td>
            </tr>
            <tr>
                <td>
                    <!-- Descrição de 2-3 palavras -->
                    <div class="bio-desc">dedicada, programadora, futura cadete</div>
                </td>
            </tr>
            <tr>
                <td>
                    <!-- Redes Sociais Alinhadas (Substitua as URLs pelos seus ícones) -->
                    <div class="social-icons">
                        <a href="#"><img src="https://flaticon.com" alt="GitHub"></a>
                        <a href="#"><img src="https://flaticon.com" alt="LinkedIn"></a>
                        <a href="#"><img src="https://flaticon.com" alt="Twitter"></a>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <!-- Botão Clicável na parte de baixo -->
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
